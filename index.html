<style>
:root{--blue:#0f2c5c;--yellow:#ffcc00;--bg:#f1f5f9}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:var(--bg);color:var(--blue);padding-bottom:90px}
.header{background:var(--blue);color:white;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.header img{width:50px;height:50px;border-radius:50%;background:white;padding:2px}
.motto{background:var(--yellow);color:var(--blue);text-align:center;padding:6px;font-weight:800;font-size:11px}
.card{background:white;margin:10px 12px;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.btn{width:100%;padding:16px;border-radius:12px;border:none;font-weight:800;font-size:15px;margin-top:8px;cursor:pointer}
.btn-green{background:#16a34a;color:white} .btn-red{background:#dc2626;color:white} .btn-blue{background:var(--blue);color:white} .btn-yellow{background:var(--yellow);color:var(--blue);border:2px solid var(--blue)}
input,select,textarea{width:100%;padding:12px;border:2px solid #cbd5e1;border-radius:10px;margin-top:6px;font-size:16px;background:white !important;color:#000 !important;-webkit-text-fill-color:#000 !important}
.pin-display{background:white !important;color:black !important;border:3px solid var(--yellow) !important;font-size:30px !important;font-weight:900 !important;letter-spacing:10px !important;text-align:center !important;height:62px !important}
.pin-kb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pin-kb button{background:var(--yellow) !important;color:var(--blue) !important;border:2px solid var(--blue) !important;font-size:26px !important;font-weight:900 !important;height:60px !important;border-radius:14px !important;box-shadow:0 3px 0 var(--blue) !important}
.pin-kb button:active{transform:translateY(3px);box-shadow:none !important}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:200}
.bottom button{background:none;border:none;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#64748b;padding:5px 8px}
.bottom button.active{color:var(--blue);font-weight:800} .badge{background:var(--yellow);color:var(--blue);padding:2px 8px;border-radius:12px;font-size:11px;font-weight:800}
.small{font-size:11px;color:#64748b}
</style>

async function saveCloud() {
  if(!useCloud || !db) return;
  try {
    const batch = db.batch();
    // salva volontari
    volunteers.forEach(v=>{
      const ref = db.collection('volunteers').doc(v.id);
      batch.set(ref, v, {merge:true});
    });
    // salva timbrature recenti (ultime 200)
    const recent = timbrature.slice(-200);
    recent.forEach(t=>{
      const ref = db.collection('timbrature').doc(String(t.id));
      batch.set(ref, t, {merge:true});
    });
    await batch.commit();
  } catch(e){ console.log('cloud save err', e); }
}

async function loadCloud() {
  if(!useCloud || !db) return;
  try {
    const volSnap = await db.collection('volunteers').get();
    if(!volSnap.empty){
      volunteers = volSnap.docs.map(d=>d.data());
      localStorage.setItem('pc_vols',JSON.stringify(volunteers));
    }
    const timSnap = await db.collection('timbrature').orderBy('ora','desc').limit(300).get();
    if(!timSnap.empty){
      const cloudTims = timSnap.docs.map(d=>d.data()).reverse();
      // merge senza duplicati
      const map = {}; [...timbrature, ...cloudTims].forEach(t=>map[t.id]=t);
      timbrature = Object.values(map).sort((a,b)=>a.id-b.id);
      localStorage.setItem('pc_tim',JSON.stringify(timbrature));
    }
  } catch(e){ console.log('load cloud err', e); }
}

function haversine(lat1,lon1,lat2,lon2){const R=6371e3; const toRad=x=>x*Math.PI/180; const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1); const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function go(p){currentPage=p; render();}
function buildPinKeyboard(){
const kb=document.getElementById('pinKb'); if(!kb) return; kb.innerHTML='';
[1,2,3,4,5,6,7,8,9,'C',0,'OK'].forEach(k=>{
const b=document.createElement('button'); b.textContent=k;
b.onclick=()=>{if(k==='C') pinBuffer=''; else if(k==='OK') doLogin(); else if(pinBuffer.length<6) pinBuffer+=k; const inp=document.getElementById('pinInput'); if(inp) inp.value='•'.repeat(pinBuffer.length);};
kb.appendChild(b);
});
}
function doLogin(){
const sel=document.getElementById('selVol'); const id=sel?sel.value:volunteers[0].id;
const pin=pinBuffer || document.getElementById('pinInput')?.value || '';
const v=volunteers.find(x=>x.id===pin) || volunteers.find(x=>x.id===id && pin===x.id);
if(volunteers.find(x=>x.id===pin)){currentUser=volunteers.find(x=>x.id===pin); localStorage.setItem('pc_user',JSON.stringify(currentUser)); pinBuffer=''; render(); initSyncLoop();}
else{alert('PIN errato. Demo: 1234 Rossi, 5678 Verdi, 9999 Coord, 0000 Servizio'); pinBuffer=''; const inp=document.getElementById('pinInput'); if(inp) inp.value='';}
}

function timbra(tipo){
if(!navigator.geolocation){alert('GPS non supportato'); return;}
navigator.geolocation.getCurrentPosition(pos=>{
const d=haversine(pos.coords.latitude,pos.coords.longitude,SEDE.lat,SEDE.lng);
if(tipo==='normale' && d>150){alert('Sei a '+Math.round(d)+'mt dalla sede, entro 150mt'); return;}
const t={id:Date.now(),userId:currentUser.id,nome:currentUser.nome,tipo,ora:new Date().toISOString(),lat:pos.coords.latitude,lng:pos.coords.longitude,dist:Math.round(d),stato:'Da avallare'};
timbrature.push(t); saveLocal(); saveCloud();
alert('Timbratura '+tipo+' OK! Distanza: '+Math.round(d)+'mt');
if(tipo==='emergenza') startEmergencyTracking();
render();
},()=>alert('Consenti posizione GPS'),{enableHighAccuracy:true});
}

navigator.geolocation.getCurrentPosition(p=>{
const log=JSON.parse(localStorage.getItem('pc_empos')||'[]');
log.push({time:new Date().toISOString(),user:currentUser.nome,lat:p.coords.latitude,lng:p.coords.longitude});
localStorage.setItem('pc_empos',JSON.stringify(log));
let n=Date.now()+1800000; localStorage.setItem('pc_emerg_next',n.toString());
if(useCloud && db){ db.collection('positions').add({user:currentUser.nome,time:new Date().toISOString(),lat:p.coords.latitude,lng:p.coords.longitude}); }
});
},1800000);
emergCountdown=setInterval(updateCountdown,1000);
updateCountdown();
}
function updateCountdown(){
const el=document.getElementById('emStatus'); if(!el) return;
const next=parseInt(localStorage.getItem('pc_emerg_next')||'0'); if(!next) return;
const diff=next-Date.now(); if(diff<=0){el.textContent='Invio in corso...'; return;}
const m=Math.floor(diff/60000), s=Math.floor((diff%60000)/1000);
el.textContent='Tracking emergenza attivo - Prossimo invio tra: '+m+'m '+s+'s (ogni 30 min reali)';
const el2=document.getElementById('emCount'); if(el2){const log=JSON.parse(localStorage.getItem('pc_empos')||'[]'); el2.textContent='Posizioni inviate: '+log.length;}
}
function startCountdownUpdater(){if(localStorage.getItem('pc_emerg_next')){if(emergCountdown) clearInterval(emergCountdown); emergCountdown=setInterval(updateCountdown,1000);}}
function fineServizio(){
const r=document.getElementById('resoconto')?.value; if(!r){alert('Inserisci resoconto'); return;}
const t={id:Date.now(),userId:currentUser.id,nome:currentUser.nome,tipo:'Fine: '+r,ora:new Date().toISOString(),stato:'Da avallare'};
timbrature.push(t); saveLocal(); saveCloud(); alert('Fine servizio registrata'); render();
}
function sendChat(){
const txt=document.getElementById('chatIn')?.value; if(!txt) return;
const chat=JSON.parse(localStorage.getItem('pc_chat')||'[]');
chat.push({nome:currentUser.nome,text:txt,time:new Date().toISOString()});
localStorage.setItem('pc_chat',JSON.stringify(chat));
if(useCloud && db) db.collection('chat').add({nome:currentUser.nome,text:txt,time:new Date().toISOString()});
document.getElementById('chatIn').value=''; render();
}
function togglePin(id){const el=document.getElementById('pin-'+id); if(!el) return; el.textContent=el.textContent==='••••'?id:'••••';}
function addVol(){const nome=prompt('Nome e cognome:'); if(!nome) return; const role=prompt('Ruolo:','Volontario')||'Volontario'; const pin=prompt('PIN 4 cifre:',Math.floor(1000+Math.random()*9000).toString()); volunteers.push({id:pin,nome,role,tel:''}); saveLocal(); saveCloud(); render();}
function editVol(id){const v=volunteers.find(x=>x.id===id); const nn=prompt('Nome:',v.nome); const nr=prompt('Ruolo:',v.role); const nt=prompt('Tel:',v.tel||''); const np=prompt('Nuovo PIN:',v.id); if(nn) v.nome=nn; if(nr) v.role=nr; if(nt!==null) v.tel=nt; if(np) v.id=np; saveLocal(); saveCloud(); render();}
function delVol(id){if(!confirm('Eliminare?')) return; volunteers=volunteers.filter(x=>x.id!==id); saveLocal(); saveCloud(); render();}
function saveFirebaseConfig(){
const txt=document.getElementById('fbConfig').value;
try{const cfg=JSON.parse(txt); localStorage.setItem('pc_firebase_config',JSON.stringify(cfg)); firebaseConfig=cfg; if(initFirebase()){alert('✅ Firebase configurato! Ora tutti i dispositivi sincronizzati. Fai reload su altri telefoni.'); loadCloud();} else alert('Config non valida');} catch(e){alert('JSON non valido. Incolla solo il contenuto di firebaseConfig');}
}
function testFirebase(){if(initFirebase()){db.collection('test').add({time:new Date().toISOString()}).then(()=>alert('✅ Connessione OK! Database funziona')).catch(e=>alert('Errore: '+e.message));} else alert('Configura prima Firebase');}
function initSyncLoop(){setInterval(()=>{if(useCloud) loadCloud();},15000);}

initFirebase();
if(currentUser) initSyncLoop();
render();
if(useCloud) loadCloud();
</script>
</body>
